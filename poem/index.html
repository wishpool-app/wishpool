<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藏头诗生成器 · AI 把名字写成诗 | Acrostic Poem Generator</title>
<meta name="description" content="输入名字，AI 一秒生成两首藏头诗（每句藏一个字），生日祝福、表白、婚礼、毕业致辞全适用。免费体验，中英双语。Hide a name inside a poem.">
<link rel="canonical" href="https://wishpool.xin/poem/">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
{"@type":"Question","name":"什么是藏头诗？","acceptedAnswer":{"@type":"Answer","text":"藏头诗是把一句话或一个名字的每个字藏在每句诗开头的一种诗体，常用于生日祝福、表白、婚礼致辞。"}},
{"@type":"Question","name":"AI 藏头诗生成器怎么用？","acceptedAnswer":{"@type":"Answer","text":"输入 2-7 个字的名字，选场景，点生成，AI 自动产出两首以名字逐字开头的藏头诗，可直接复制使用。"}},
{"@type":"Question","name":"可以免费生成吗？","acceptedAnswer":{"@type":"Answer","text":"每人每天可免费生成 2 次，解锁当日不限次。"}}]}
</script>
<style>
:root{--gold:#9a7b2f;--ink:#26231c;--dim:#8c8574;--line:#e6dfcd;--bg:#f7f3e9;--card:#fffdf6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',Georgia,serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}
.langbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
.langbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.langbar button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
h1{font-size:24px;font-weight:800;letter-spacing:1px}
h1 .ai{color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 16px;line-height:1.7}
.social{font-size:12px;color:var(--gold);font-weight:600;margin:-8px 0 14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(150,120,60,.07)}
.lbl{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:#fff;cursor:pointer;transition:.15s;user-select:none}
.chip.on{border-color:var(--gold);background:rgba(154,123,47,.09);color:var(--gold);font-weight:700}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;outline:none;margin-bottom:10px}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;height:52px}
.go{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,#b8923d,#8f6d1f);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:3px}
.go:disabled{opacity:.5}
.quota{font-size:12px;color:var(--dim);text-align:center;margin-top:9px}
.poem{border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px;background:#fffdf8;position:relative}
.poem .pt{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.poem .pl{font-size:17px;line-height:2.05;font-family:Georgia,'Kaiti SC','KaiTi','STKaiti',serif;white-space:pre-wrap;letter-spacing:1px}
.poem .pl b{color:var(--gold);font-size:19px}
.copy{margin-top:10px;font-size:12px;color:var(--gold);border:1px solid var(--gold);background:none;border-radius:8px;padding:5px 14px;cursor:pointer;font-weight:600}
.copy:active{background:rgba(154,123,47,.1)}
.err{background:#fdf3ef;border:1px solid #f0cab8;color:#a8502e;border-radius:11px;padding:11px 13px;font-size:13px;margin-top:10px;line-height:1.6;display:none}
.lock{text-align:center;display:none}
.lock b{color:var(--gold)}
.lock img{display:block;width:220px;max-width:70%;margin:10px auto;border-radius:12px;border:1px solid var(--line)}
.urow{display:flex;gap:8px;margin-top:10px}
.urow input{margin:0;flex:1;text-transform:uppercase}
.urow button{padding:11px 18px;border:none;border-radius:11px;background:var(--gold);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
footer{color:var(--dim);font-size:11px;text-align:center;margin-top:20px;line-height:1.8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="langbar"><button id="lgZh" class="on">中文</button><button id="lgEn">English</button></div>
<h1 id="t1">藏头<span class="ai">诗</span>生成器</h1>
<div class="sub" id="t2">输入名字，AI 一秒写出两首藏头诗——每句藏一个字。<br>生日祝福、表白、婚礼致辞、毕业赠言，拿去就能用。</div>
<div class="social" id="social"></div>

<div class="card">
  <div class="lbl" id="l1">藏头的名字（2-7 个字）</div>
  <input id="name" maxlength="7" placeholder="如：陈卫军 / Emily">
  <div style="height:12px"></div>
  <div class="lbl" id="l2">什么场景？</div>
  <div class="chips" id="occs"></div>
  <div style="height:12px"></div>
  <div class="lbl" id="l3">补充一句（可选）</div>
  <textarea id="note" maxlength="80" placeholder="如：爱钓鱼，四十岁生日"></textarea>
  <button class="go" id="go">生 成</button>
  <div class="quota" id="q"></div>
  <div class="err" id="err"></div>
</div>

<div id="outs"></div>

<div class="card lock" id="lock">
  <div class="lbl" style="text-align:center" id="lk1">免费次数已用完</div>
  <p style="font-size:14px;line-height:1.9;text-align:center;color:var(--dim)" id="lk2">
    每人每天免费 2 次。急用不限量？<br>扫码付款 <b>¥9.9</b>，把截图发给客服拿解锁码，<br>输入后<b>当日不限次</b>。
  </p>
  <img src="/ai/qr.jpg" alt="微信收款码">
  <div class="urow">
    <input id="ucode" maxlength="6" placeholder="输入解锁码">
    <button id="uok">解锁</button>
  </div>
  <div class="err" id="uerr"></div>
</div>

<footer id="ft">
  诗由 AI 生成，供娱乐与祝福场合使用。<br>
  免费 2 次/天 · 解锁后当日不限次 · © wishpool.xin
</footer>

<script>
const API='https://ai.hzjiance.cn';
const qs=s=>document.querySelector(s);
let lang='zh', occ=0, unlocked=false, freeUsed=null;

const I18N={
 zh:{t1:'藏头<span class="ai">诗</span>生成器',t2:'输入名字，AI 一秒写出两首藏头诗——每句藏一个字。<br>生日祝福、表白、婚礼致辞、毕业赠言，拿去就能用。',
   l1:'藏头的名字（2-7 个字）',ph1:'如：陈卫军 / 李明',l2:'什么场景？',l3:'补充一句（可选）',ph3:'如：爱钓鱼，四十岁生日',go:'生 成',
   q:(f,u)=>'今日免费 2 次 · 已用 '+u+' 次'+(f>0?' · 余 '+f:''),needName:'请输入 2-7 个字的名字',
   gen:'藏 头 生 成 中…',copy:'复制',copied:'已复制 ✓',occs:['生日祝福','表白','婚礼','毕业','新年','励志','感恩'],
   lk1:'免费次数已用完',lk2:'每人每天免费 2 次。急用不限量？<br>扫码付款 <b>¥9.9</b>，把截图发给客服拿解锁码，<br>输入后<b>当日不限次</b>。',
   ucode:'输入解锁码',uok:'解锁',soc:t=>'🔥 全站已写出 <b style="font-size:15px">'+t+'</b> 首藏头诗',
   errNet:'网络异常，请重试',errUnlock:'解锁成功！当日不限次 🎉'},
 en:{t1:'Acrostic <span class="ai">Poem</span> Generator',t2:'Type a name — AI writes two acrostic poems in one second.<br>Each line starts with a letter of the name. Birthdays, weddings, graduations.',
   l1:'Name to hide (2-7 letters)',ph1:'e.g. Emily / James',l2:'Occasion?',l3:'Add a detail (optional)',ph3:'e.g. loves fishing, 40th birthday',go:'WRITE POEMS',
   q:(f,u)=>'2 free per day · used '+u,needName:'Please enter a name (2-7 letters)',
   gen:'WRITING POEMS…',copy:'Copy',copied:'Copied ✓',occs:['Birthday','Proposal','Wedding','Graduation','New Year','Motivation','Thanks'],
   lk1:'Free uses are used up',lk2:'2 free per day. Need more today?<br>Unlock unlimited uses for <b>¥9.9</b>.<br>Enter your unlock code below.',
   ucode:'Enter unlock code',uok:'Unlock',soc:t=>'🔥 <b style="font-size:15px">'+t+'</b> acrostic poems written so far',
   errNet:'Network error, please retry',errUnlock:'Unlocked! Unlimited today 🎉'}
};

const T=()=>I18N[lang];
function paint(){
  const t=T();
  qs('#t1').innerHTML=t.t1; qs('#t2').innerHTML=t.t2;
  qs('#l1').textContent=t.l1; qs('#name').placeholder=t.ph1;
  qs('#l2').textContent=t.l2; qs('#l3').textContent=t.l3; qs('#note').placeholder=t.ph3;
  qs('#go').textContent=qs('#go').disabled?t.gen:t.go;
  document.documentElement.lang = lang==='en'?'en':'zh-CN';
  const oc=qs('#occs'); oc.innerHTML='';
  t.occs.forEach((o,i)=>{const c=document.createElement('button');c.className='chip'+(i===occ?' on':'');c.textContent=o;c.onclick=()=>{occ=i;paint()};oc.appendChild(c)});
  paintQ();
}
function paintQ(){
  const t=T();
  if(freeUsed!==null){ qs('#q').textContent = unlocked ? t.q('∞',freeUsed) : t.q(Math.max(0,2-freeUsed),freeUsed); }
  if(freeUsed!==null && !unlocked && freeUsed>=2){ qs('#lock').style.display='block'; }
}
function showErr(m){ const e=qs('#err'); e.textContent=m||''; e.style.display=m?'block':'none'; }

qs('#lgZh').onclick=()=>{lang='zh';qs('#lgZh').classList.add('on');qs('#lgEn').classList.remove('on');paint()};
qs('#lgEn').onclick=()=>{lang='en';qs('#lgEn').classList.add('on');qs('#lgZh').classList.remove('on');paint()};

fetch(API+'/poem/stats').then(r=>r.json()).then(d=>{ if(d.total) qs('#social').innerHTML=T().soc(d.total); }).catch(()=>{});

// 解锁状态记忆
const UK='poemunlock_'+new Date().toISOString().slice(0,10);
const savedCode=localStorage.getItem(UK);
if(savedCode){ unlocked=true; }

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderPoems(poems){
  const box=qs('#outs'); box.innerHTML='';
  poems.forEach(p=>{
    const name=qs('#name').value.trim();
    const div=document.createElement('div'); div.className='poem';
    const lines=p.lines.map(l=>{
      if(lang==='zh'){ const c=l.charAt(0); return '<b>'+esc(c)+'</b>'+esc(l.slice(1)); }
      const m=l.match(/^([A-Za-z])(.*)$/); return m?'<b>'+esc(m[1].toUpperCase())+'</b>'+esc(m[2]):esc(l);
    }).join('\n');
    div.innerHTML='<div class="pt">'+esc(p.title||'')+'</div><div class="pl">'+lines+'</div><button class="copy">'+T().copy+'</button>';
    div.querySelector('.copy').onclick=()=>{ navigator.clipboard.writeText((p.title||'')+'\n'+p.lines.join('\n')).then(()=>{ div.querySelector('.copy').textContent=T().copied; setTimeout(()=>div.querySelector('.copy').textContent=T().copy,1500); }); };
    box.appendChild(div);
  });
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

qs('#go').onclick=async ()=>{
  showErr('');
  const name=qs('#name').value.trim();
  if(!name||name.length<2){ showErr(T().needName); return; }
  if(freeUsed!==null && !unlocked && freeUsed>=2){ qs('#lock').style.display='block'; return; }
  const b=qs('#go'); b.disabled=true; b.innerHTML='<span class="spin"></span> '+T().gen;
  try{
    const r=await fetch(API+'/poem',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,occasion:T().occs[occ],note:qs('#note').value.trim(),lang,unlockCode:savedCode||''})});
    const d=await r.json();
    if(!r.ok){ if(d.needUnlock){ paintQ(); qs('#lock').style.display='block'; } showErr(d.error||T().errNet); return; }
    if(d.quota){ freeUsed=d.quota.used!=null?d.quota.used:(freeUsed===null?1:freeUsed+1); if(d.quota.unlocked) unlocked=true; }
    renderPoems(d.poems); paintQ();
    if(d.total) qs('#social').innerHTML=T().soc(d.total);
  }catch(e){ showErr(T().errNet); }
  finally{ b.disabled=false; b.textContent=T().go; }
};

qs('#uok').onclick=async ()=>{
  const e=qs('#uerr'); e.style.display='none';
  const code=qs('#ucode').value.trim().toUpperCase();
  try{
    const r=await fetch(API+'/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const d=await r.json();
    if(!r.ok){ e.textContent=d.error||'error'; e.style.display='block'; return; }
    unlocked=true; localStorage.setItem(UK,code); e.textContent=T().errUnlock; e.style.display='block';
    setTimeout(()=>{ qs('#lock').style.display='none'; },1200);
  }catch(err){ e.textContent=T().errNet; e.style.display='block'; }
};

paint();
</script>
</body>
</html>
