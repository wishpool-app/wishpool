<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 祝福文案生成器 · 一秒写出走心祝福</title>
<meta name="description" content="输入对象和场景，AI 一秒生成 3 条可直接发微信的祝福文案：生日祝福、新年祝福、表白、道歉、检讨书、朋友圈文案。">
<link rel="canonical" href="https://wishpool.xin/ai/">
<style>
:root{--gold:#c9932a;--ink:#2b2a26;--dim:#8a8577;--line:#ece7db;--bg:#faf7f0;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:800;letter-spacing:.5px}
h1 .ai{color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 16px;line-height:1.6}
.social{font-size:12px;color:var(--gold);font-weight:600;margin:-8px 0 14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(180,150,80,.06)}
.lbl{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:#fff;cursor:pointer;transition:.15s;user-select:none}
.chip.on{border-color:var(--gold);background:rgba(201,147,42,.08);color:var(--gold);font-weight:700}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fff;outline:none;margin-bottom:10px}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;height:56px}
.go{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,#d9a53d,#b98520);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:2px}
.go:disabled{opacity:.5}
.quota{font-size:12px;color:var(--dim);text-align:center;margin-top:9px}
.res{border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:11px;background:#fffdf8}
.res p{font-size:15px;line-height:1.8;white-space:pre-wrap}
.copy{margin-top:9px;font-size:12px;color:var(--gold);border:1px solid var(--gold);background:none;border-radius:8px;padding:5px 14px;cursor:pointer;font-weight:600}
.copy:active{background:rgba(201,147,42,.1)}
.err{background:#fdf1f0;border:1px solid #f3c8c4;color:#b4403a;border-radius:11px;padding:11px 13px;font-size:13px;margin-top:10px;line-height:1.6;display:none}
.lock{text-align:center;display:none}
.lock b{color:var(--gold)}
footer{color:var(--dim);font-size:11px;text-align:center;margin-top:20px;line-height:1.8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>AI 祝福<span class="ai">文案</span>生成器</h1>
<div class="sub">输入对象和场景，AI 一秒给你 3 条能直接发微信的走心文案。<br>不再「岁月如梭」，句句有细节。</div>
<div class="social" id="social"></div>

<div class="card">
  <div class="lbl">要写什么？</div>
  <div class="chips" id="types"></div>
  <div style="height:14px"></div>
  <div class="lbl">什么语气？</div>
  <div class="chips" id="tones"></div>
  <div style="height:14px"></div>
  <input id="to" placeholder="送给谁？（如：王芳 / 老爸 / 张总）" maxlength="20">
  <input id="rel" placeholder="你的身份或关系（如：女儿 / 好朋友 / 下属）" maxlength="20">
  <textarea id="extra" placeholder="补充信息，写得越细越走心（可选）：比如「她今年考上研究生」「爸爱钓鱼，下周六生日宴」" maxlength="120"></textarea>
  <button class="go" id="go">生 成 3 条</button>
  <div class="quota" id="q">今日免费 5 条 · 余 5 条</div>
  <div class="err" id="err"></div>
</div>

<div class="card lock" id="lock">
  <div class="lbl" style="text-align:center;font-size:15px;color:var(--ink)">今日免费 5 条已用完</div>
  <p style="font-size:14px;line-height:1.9;text-align:center;color:var(--dim)">
    解锁<b style="color:var(--gold)">今日不限次</b> · <b style="color:var(--gold)">¥9.9</b><br>
    ① 长按识别下方二维码付款（备注「AI文案」）<br>
    ② 把付款截图发给军哥，领取 6 位解锁码<br>
    ③ 在下方输入解锁码，立即不限次
  </p>
  <img src="qr.jpg" alt="微信收款码" style="display:block;width:220px;max-width:70%;margin:10px auto;border-radius:12px;border:1px solid var(--line)">
  <div style="text-align:center;color:var(--dim);font-size:12px;margin:6px 0">—— 或 ——</div>
  <button class="go" id="paybtn" style="margin-bottom:10px;display:none">微信扫码付 ¥9.9 · 自动发码秒解锁</button>
  <div id="payqr" style="display:none;text-align:center">
    <img id="payimg" alt="支付二维码" style="width:210px;max-width:60%;border-radius:12px;border:1px solid var(--line)">
    <div class="quota">支付完成后本页自动解锁（通常几秒）</div>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <input id="uc" placeholder="输入 6 位解锁码" maxlength="6" style="margin-bottom:0;text-transform:uppercase;text-align:center;letter-spacing:4px;font-family:var(--mono,monospace)">
    <button class="go" id="ubtn" style="width:auto;padding:11px 22px;letter-spacing:1px">解锁</button>
  </div>
  <div class="err" id="uerr"></div>
</div>

<div id="out"></div>

<footer>
  由 wishpool.xin 出品 · AI 生成内容仅供参考<br>
  文案版权归你所有，放心使用
</footer>

<script>
const TYPES = [['birthday','🎂 生日祝福'],['newyear','🧨 新年祝福'],['love','💗 表白'],['sorry','🙏 道歉'],['review','📝 检讨书'],['moments','📸 朋友圈'],['festival','🏮 节日祝福'],['toast','🥂 祝酒词']];
const TONES = [['warm','走心'],['funny','幽默'],['formal','正式'],['short','简短']];
let type='birthday', tone='warm';
const API = 'https://ai.hzjiance.cn';

function chips(el, arr, cur, cb){
  el.innerHTML = arr.map(([v,t])=>`<div class="chip${v===cur?' on':''}" data-v="${v}">${t}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>cb(c.dataset.v));
}
function reType(v){ type=v; chips(qs('#types'),TYPES,v,reType); }
function reTone(v){ tone=v; chips(qs('#tones'),TONES,v,reTone); }
function qs(s){ return document.querySelector(s); }
reType(type); reTone(tone);

const QKEY = 'aiq_' + new Date().toISOString().slice(0,10);
let UNLOCK = localStorage.getItem('aiunlock') || '';
let free = UNLOCK ? 99 : Math.max(0, 5 - parseInt(localStorage.getItem(QKEY)||'0',10));
function paintQ(){ if(UNLOCK){ qs('#q').textContent = '✅ 已解锁 · 今日不限次'; qs('#lock').style.display='none'; qs('#go').disabled=false; return; } qs('#q').textContent = `今日免费 5 条 · 余 ${free} 条`; if(free<=0){ qs('#lock').style.display='block'; qs('#go').disabled=true; } }
paintQ();

function showErr(m){ const e=qs('#err'); e.textContent=m; e.style.display=m?'block':'none'; }

/* 社交证明：全站累计生成量 + 访问计数 */
fetch(API+'/stats?visit=1').then(r=>r.json()).then(d=>{
  const el = qs('#social');
  if(d.total > 3) el.textContent = `🔥 全站已生成 ${d.total} 条走心文案`;
}).catch(()=>{});

qs('#go').onclick = async ()=>{
  showErr('');
  if(free<=0) return;
  const btn = qs('#go'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> 生成中…';
  try{
    const r = await fetch(API+'/gen', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type, tone, to:qs('#to').value.trim(), rel:qs('#rel').value.trim(), extra:qs('#extra').value.trim(), unlockCode:UNLOCK})});
    const d = await r.json();
    if(!r.ok){ if(d.needUnlock){ paintQ(); } showErr(d.error||'生成失败，请重试'); return; }
    if(d.quota && d.quota.unlocked){ free = 99; }
    else { free = d.quota ? d.quota.free : free-1; localStorage.setItem(QKEY, String(5-free)); }
    paintQ();
    if(d.total) qs('#social').textContent = '🔥 全站已生成 ' + d.total + ' 条走心文案';
    qs('#out').innerHTML = d.items.map((t,i)=>`
      <div class="card res"><div class="lbl">方案 ${'一二三'[i]||i+1}</div><p>${t.replace(/</g,'&lt;')}</p>
      <button class="copy" data-i="${i}">复制</button></div>`).join('');
    qs('#out').querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
      navigator.clipboard.writeText(d.items[+b.dataset.i]).then(()=>{ b.textContent='已复制 ✓'; setTimeout(()=>b.textContent='复制',1500); });
    });
    qs('#out').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){ showErr('网络异常，请重试'); }
  finally{ btn.disabled = free<=0; btn.textContent='生 成 3 条'; }
};

/* 在线支付：下单 → 跳支付页 → 支付完自动回跳解锁 */
qs('#paybtn').onclick = async ()=>{
  const b=qs('#paybtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 创建订单…';
  try{
    const r=await fetch(API+'/pay/create',{method:'POST'});
    const d=await r.json();
    if(!d.ok){ const ue=qs('#uerr'); ue.textContent=d.error||'下单失败'; ue.style.display='block'; b.disabled=false; b.textContent='微信扫码付 ¥9.9 · 自动发码秒解锁'; return; }
    location.href = d.url || ('https://wishpool.xin/ai/?oid=' + d.oid);
  }catch(e){ b.disabled=false; b.textContent='微信扫码付 ¥9.9 · 自动发码秒解锁'; }
};

/* 支付回跳：带 ?oid 时轮询订单，支付成功自动解锁 */
const oidParam = new URLSearchParams(location.search).get('oid');
if(oidParam){
  const t0=Date.now();
  const pt=setInterval(async ()=>{
    try{
      const q=await (await fetch(API+'/pay/query?oid='+encodeURIComponent(oidParam))).json();
      if(q.paid){ clearInterval(pt); UNLOCK=q.code; localStorage.setItem('aiunlock', q.code); paintQ(); history.replaceState(null,'','/ai/'); return; }
    }catch(e){}
    if(Date.now()-t0>120000) clearInterval(pt);
  }, 3000);
}

/* 解锁码 */
qs('#ubtn').onclick = async ()=>{
  const ue = qs('#uerr'); ue.style.display='none';
  const code = qs('#uc').value.trim().toUpperCase();
  const btn = qs('#ubtn'); btn.disabled=true; btn.textContent='验证中…';
  try{
    const r = await fetch(API+'/unlock', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const d = await r.json();
    if(!r.ok){ ue.textContent=d.error||'解锁失败'; ue.style.display='block'; return; }
    UNLOCK = code; localStorage.setItem('aiunlock', code);
    paintQ();
  }catch(e){ ue.textContent='网络异常，请重试'; ue.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='解锁'; }
};
</script>
</body>
</html>
