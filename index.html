<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg1:#070313; --bg2:#150b36; --bg3:#2b1b5e; --bg4:#3d2a7d;
    --glow:#9d7bff; --glow2:#ff9ad5; --gold:#ffd97a; --gold2:#ffb3d9;
    --text:#f2ecff; --muted:#a99cc9; --faint:#6e5f96;
    --card:rgba(255,255,255,.055); --line:rgba(157,123,255,.30); --line2:rgba(157,123,255,.55);
    --shadow:0 8px 32px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 50% -8%, var(--bg4), transparent 60%),
      radial-gradient(700px 420px at 12% 30%, rgba(157,123,255,.14), transparent 65%),
      radial-gradient(700px 420px at 88% 70%, rgba(255,154,213,.10), transparent 65%),
      linear-gradient(180deg, var(--bg2), var(--bg1) 70%);
    color:var(--text); min-height:100vh; overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3.4s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:.95;transform:scale(1.1)}}
  .moon{position:absolute;top:5%;right:7%;width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%, #fffdf2, #ffeec2 58%, #ecd398);
    box-shadow:0 0 46px 14px rgba(255,233,184,.22), inset -10px -8px 0 rgba(200,170,120,.18);opacity:.92}
  .meteor{position:absolute;width:110px;height:1.5px;
    background:linear-gradient(90deg, rgba(255,255,255,.9), transparent);
    border-radius:2px;transform:rotate(-32deg);opacity:0;animation:meteor 1.6s ease-out}
  @keyframes meteor{0%{opacity:0}8%{opacity:1}100%{opacity:0;transform:rotate(-32deg) translateX(-360px)}}

  .app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:0 18px 110px}
  header{padding-top:26px;text-align:center;position:relative}
  .langbtn{position:absolute;top:0;right:0;padding:6px 12px;border-radius:16px;cursor:pointer;
    font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--card)}
  .logo{font-size:30px;letter-spacing:6px;font-weight:700;
    background:linear-gradient(120deg,#fff 20%,var(--gold) 50%,var(--glow2) 85%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(157,123,255,.55))}
  .slogan{color:var(--muted);font-size:12.5px;margin-top:8px;letter-spacing:2px}

  .glass{background:var(--card);border:1px solid var(--line);border-radius:20px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
  .page{display:none;animation:pagein .35s ease}
  .page.on{display:block}
  @keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sec-title{font-size:13px;color:var(--muted);letter-spacing:2px;margin:20px 0 4px;display:flex;justify-content:space-between;align-items:center}

  .pool{position:relative;height:200px;border-radius:26px;overflow:hidden;margin-top:22px;
    background:linear-gradient(180deg, rgba(157,123,255,.22), rgba(61,42,125,.55) 45%, rgba(7,3,19,.95));
    border:1px solid var(--line2);
    box-shadow:inset 0 14px 44px rgba(157,123,255,.28), 0 16px 50px rgba(157,123,255,.18)}
  .wave{position:absolute;left:-50%;width:200%;height:56px;bottom:26px;opacity:.5;animation:waveMove 7s linear infinite}
  .wave.w2{bottom:16px;opacity:.35;animation-duration:11s;animation-direction:reverse}
  @keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(25%)}}
  .shine{position:absolute;left:-60%;top:0;width:40%;height:100%;transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,60%{left:-60%}90%,100%{left:130%}}
  .pool-ring{position:absolute;left:50%;bottom:30px;width:180px;height:70px;border-radius:50%;
    border:1.5px solid rgba(255,217,122,.35);transform:translateX(-50%)}
  .ripple{position:absolute;left:50%;bottom:40px;width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,217,122,.95);transform:translate(-50%,0);animation:rip 1.7s cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes rip{0%{width:16px;height:16px;opacity:1}100%{width:260px;height:110px;opacity:0}}
  .coin{position:absolute;left:50%;top:-34px;width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #fff6d0, var(--gold) 52%, #b8912f);
    box-shadow:0 0 22px 8px rgba(255,217,122,.55), inset 0 -3px 5px rgba(140,100,20,.5);
    transform:translateX(-50%);animation:drop 1.25s cubic-bezier(.45,0,.85,.55) forwards;z-index:3}
  @keyframes drop{0%{top:-34px;opacity:0}12%{opacity:1}
    55%{transform:translateX(-50%) rotate(160deg)}100%{top:140px;opacity:0;transform:translateX(-50%) rotate(320deg) scale(.5)}}
  .pool-label{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--faint);font-size:11px;letter-spacing:4px;z-index:2}
  .fresh-chip{position:absolute;top:12px;right:12px;font-size:10.5px;color:var(--gold);
    background:rgba(255,217,122,.14);border:1px solid rgba(255,217,122,.4);padding:4px 10px;border-radius:12px;z-index:2}

  .quote-card{padding:20px 18px;margin-top:18px;position:relative;overflow:hidden}
  .quote-card::before{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;
    background:radial-gradient(circle, rgba(255,217,122,.18), transparent 70%)}
  .quote{font-size:16px;line-height:1.8;text-align:center}
  .quote b{color:var(--gold);font-weight:600}
  .quote-tag{font-size:10.5px;color:var(--faint);text-align:center;margin-top:10px;letter-spacing:3px}

  .input-card{padding:16px;margin-top:18px}
  .cats{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .cat{flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;
    border:1px solid var(--line);color:var(--muted);transition:.2s;white-space:nowrap}
  .cat.on{color:#1a0f3d;font-weight:600;border-color:transparent;
    background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 3px 14px rgba(255,217,122,.3)}
  textarea{width:100%;background:rgba(7,3,19,.55);border:1px solid var(--line);border-radius:14px;
    color:var(--text);font-size:15px;line-height:1.7;padding:13px;min-height:88px;resize:none;outline:none;font-family:inherit}
  textarea:focus{border-color:var(--line2);box-shadow:0 0 16px rgba(157,123,255,.30)}
  textarea::placeholder{color:var(--faint)}
  .input-foot{display:flex;justify-content:space-between;margin-top:6px}
  .hint,.count{font-size:11px;color:var(--faint)}
  .btn{display:block;width:100%;margin-top:14px;padding:14px;border:none;border-radius:14px;
    font-size:16px;font-weight:700;color:#1a0f3d;cursor:pointer;letter-spacing:1px;
    background:linear-gradient(92deg,var(--gold),var(--gold2));
    box-shadow:0 6px 24px rgba(255,217,122,.32);transition:transform .15s}
  .btn:active{transform:scale(.965)}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(255,217,122,.45);box-shadow:none;font-weight:600}
  .btn.dark{background:linear-gradient(92deg,var(--glow),var(--glow2));color:#fff;
    box-shadow:0 6px 24px rgba(157,123,255,.35)}
  .btn.sm{width:auto;display:inline-block;padding:8px 18px;font-size:13px;margin-top:0;border-radius:12px}

  .stats{display:flex;gap:10px;margin-top:18px}
  .stat{flex:1;text-align:center;padding:13px 4px}
  .stat .num{font-size:23px;font-weight:800;
    background:linear-gradient(120deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat .lbl{font-size:10.5px;color:var(--muted);margin-top:5px}

  .story{padding:18px;margin-top:14px;position:relative;overflow:hidden}
  .story .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#cabdff;
    background:rgba(157,123,255,.18);border:1px solid var(--line2);padding:4px 12px;border-radius:12px}
  .story h3{font-size:15px;margin:12px 0 8px;color:var(--gold);word-break:break-word;padding-right:30px}
  .story .st{font-size:14px;line-height:2.0;white-space:pre-wrap}
  .story .sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
  .playbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:24px;
    background:linear-gradient(92deg,var(--glow),var(--glow2));color:#fff;font-size:14px;font-weight:700;
    border:none;cursor:pointer;box-shadow:0 4px 18px rgba(157,123,255,.4)}
  .playbtn.playing{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(157,123,255,.4)}50%{box-shadow:0 4px 30px rgba(255,154,213,.7)}}
  .wavebars{display:flex;gap:3px;align-items:flex-end;height:16px}
  .wavebars i{width:3px;background:var(--glow2);border-radius:2px;animation:bar .8s infinite ease-in-out}
  .wavebars i:nth-child(2){animation-delay:.15s}.wavebars i:nth-child(3){animation-delay:.3s}
  .wavebars i:nth-child(4){animation-delay:.45s}.wavebars i:nth-child(5){animation-delay:.6s}
  @keyframes bar{0%,100%{height:4px}50%{height:16px}}
  .gen-box{text-align:center;padding:26px 18px;color:var(--muted);font-size:13px;line-height:2}
  .fav-btn{background:none;border:none;cursor:pointer;font-size:18px;filter:grayscale(1);opacity:.5;transition:.2s}
  .fav-btn.on{filter:none;opacity:1;transform:scale(1.1)}
  .mini-ops{display:flex;gap:8px;align-items:center}
  .mini-op{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    font-size:11px;padding:4px 10px;cursor:pointer}

  .aff{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;margin-top:12px;border-radius:16px}
  .aff .at{flex:1;font-size:14px;line-height:1.8}

  .prog{padding:18px;margin-top:14px}
  .prog .ph{display:flex;align-items:center;gap:12px}
  .prog .pi{font-size:30px}
  .prog .pt{flex:1}
  .prog .pn{font-size:15px;font-weight:700;color:var(--gold)}
  .prog .pd{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
  .pbar{height:6px;background:rgba(157,123,255,.15);border-radius:4px;margin-top:14px;overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,var(--gold),var(--glow2));transition:width .4s}
  .pbar-lbl{font-size:10.5px;color:var(--faint);margin-top:6px;text-align:right}
  .sess .daychip{font-size:10.5px;color:#cabdff;background:rgba(157,123,255,.18);padding:3px 10px;border-radius:10px}
  .sess .body{font-size:14px;line-height:2;margin-top:10px;white-space:pre-wrap}

  .filters{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:0 0 auto;padding:6px 14px;border-radius:18px;font-size:12px;cursor:pointer;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.on{color:#fff;background:rgba(157,123,255,.28);border-color:var(--line2)}
  .wish{display:flex;gap:12px;align-items:flex-start;padding:15px;margin-top:12px;border-radius:16px}
  .wish .icon{font-size:19px;filter:drop-shadow(0 0 6px rgba(255,217,122,.4))}
  .wish .body{flex:1;min-width:0}
  .wish .txt{font-size:14px;line-height:1.7;word-break:break-word}
  .wish .meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
  .meta .tag{padding:1px 8px;border-radius:8px;background:rgba(157,123,255,.16);color:#cabdff}
  .meta .days{color:var(--faint)}
  .wish.done .txt{color:var(--gold);text-decoration:line-through;opacity:.7}
  .wish .ops{display:flex;flex-direction:column;gap:8px}
  .op{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;
    font-size:11.5px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  .op.ok{color:var(--gold);border-color:rgba(255,217,122,.5)}

  .streak-row{display:flex;align-items:center;justify-content:space-between;padding:16px}
  .streak-row .left{font-size:13px;color:var(--muted);line-height:1.8}
  .streak-row .big{font-size:30px;font-weight:800;color:var(--gold)}
  .moods{display:flex;gap:10px;margin-top:12px}
  .mood{flex:1;text-align:center;padding:10px 0;border-radius:14px;cursor:pointer;font-size:24px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.2s}
  .mood.on{background:rgba(157,123,255,.25);border-color:var(--line2);transform:scale(1.06)}
  .mood .m{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .entry{padding:14px 16px;margin-top:12px;border-radius:14px;display:flex;gap:12px;align-items:flex-start}
  .entry .em{font-size:22px}
  .entry .et{font-size:13.5px;line-height:1.7}
  .entry .ed{font-size:11px;color:var(--faint);margin-top:5px}

  .mask{position:fixed;inset:0;background:rgba(4,2,12,.8);backdrop-filter:blur(6px);z-index:20;
    display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;
    padding:24px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetup .4s cubic-bezier(.2,.8,.3,1)}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .q-title{text-align:center;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:6px}
  .q-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}
  .qdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .qdots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
  .qdots i.on{background:var(--gold)}
  .opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .opt{padding:8px 14px;border-radius:18px;font-size:13px;cursor:pointer;border:1px solid var(--line);color:var(--muted)}
  .opt.on{color:#1a0f3d;font-weight:600;background:linear-gradient(90deg,var(--gold),var(--gold2));border-color:transparent}

  .pay-head{text-align:center}
  .pay-head .crown{font-size:40px}
  .pay-head h3{font-size:19px;color:var(--gold);margin-top:8px}
  .pay-head p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.8}
  .plans{display:flex;gap:10px;margin-top:18px}
  .plan{flex:1;padding:14px 8px;text-align:center;border-radius:16px;cursor:pointer;border:1.5px solid var(--line);position:relative}
  .plan.on{border-color:var(--gold);background:rgba(255,217,122,.10)}
  .plan .pp{font-size:17px;font-weight:800;color:var(--gold)}
  .plan .pd{font-size:10.5px;color:var(--muted);margin-top:4px}
  .plan .save{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9.5px;
    background:var(--gold2);color:#1a0f3d;padding:2px 10px;border-radius:8px;font-weight:700}
  .pay-note{text-align:center;font-size:10.5px;color:var(--faint);margin-top:12px;line-height:1.8}

  .setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-top:12px;border-radius:14px}
  .setrow .sl{font-size:13.5px;color:var(--text)}
  .setrow .sd{font-size:10.5px;color:var(--faint);margin-top:4px}
  .switch{width:44px;height:24px;border-radius:14px;background:rgba(157,123,255,.2);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
  .switch.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .switch.on::after{left:22px;background:#1a0f3d}
  input[type=time]{background:rgba(7,3,19,.55);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:5px 8px;font-size:13px;outline:none}
  .in{width:100%;background:rgba(7,3,19,.55);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:14px;padding:12px;outline:none;font-family:inherit}
  .in:focus{border-color:var(--line2)}

  .tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:540px;
    z-index:5;padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(7,3,19,.92) 40%);display:flex;gap:4px}
  .tab{flex:1;text-align:center;padding:8px 0;border-radius:16px;cursor:pointer;color:var(--muted);font-size:10px}
  .tab .ti{font-size:19px;display:block;margin-bottom:2px}
  .tab.on{color:var(--gold);background:rgba(157,123,255,.14);border-color:var(--line)}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);
    background:rgba(157,123,255,.92);color:#fff;padding:11px 24px;border-radius:22px;font-size:13px;
    opacity:0;transition:.3s;z-index:30;pointer-events:none;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:25}
  .footer{text-align:center;color:var(--faint);font-size:10.5px;margin-top:34px;line-height:2}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="sky" id="sky"><div class="moon"></div></div>

<div class="app">
  <header>
    <div class="langbtn" onclick="toggleLang()">🌐 <span id="langLabel">EN</span></div>
    <div class="logo" id="logo"></div>
    <div class="slogan" id="slogan"></div>
  </header>

  <section class="page on" id="pg-pool">
    <div class="pool" id="pool">
      <svg class="wave w1" viewBox="0 0 240 56" preserveAspectRatio="none"><path d="M0 28 Q30 8 60 28 T120 28 T180 28 T240 28 V56 H0 Z" fill="rgba(157,123,255,.28)"/></svg>
      <svg class="wave w2" viewBox="0 0 240 56" preserveAspectRatio="none"><path d="M0 30 Q30 12 60 30 T120 30 T180 30 T240 30 V56 H0 Z" fill="rgba(255,154,213,.22)"/></svg>
      <div class="pool-ring"></div><div class="shine"></div>
      <div class="fresh-chip" id="freshChip" style="display:none"></div>
      <div class="pool-label" id="poolLabel"></div>
    </div>
    <div class="glass quote-card">
      <div class="quote" id="quote"></div>
      <div class="quote-tag" id="quoteTag"></div>

let AC=null;
function chime(){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  [880,1320].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,AC.currentTime);
    g.gain.linearRampToValueAtTime(.12,AC.currentTime+.02+i*.09);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.9+i*.09);
    o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.09);o.stop(AC.currentTime+1.2)});
}catch(e){}}

let speaking=false;
function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=L==='zh'?'zh-CN':'en-US';u.rate=.92;u.pitch=1;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.indexOf(L==='zh'?'zh':'en')===0);
    if(vs.length)u.voice=vs[0];
    u.onend=u.onerror=()=>{speaking=false;renderPlayBtns()};
    speechSynthesis.speak(u);speaking=true;renderPlayBtns();
  }catch(e){toast(tq(9))}
}
function stopSpeak(){speechSynthesis.cancel();speaking=false;renderPlayBtns()}

}

function activeProgCount(){return Object.values(state.progs).filter(p=>p.doneDays.length<7).length}
function renderProgs(){
  const el=document.getElementById('progList');el.innerHTML='';
  PROGS.forEach(p=>{
    const pr=state.progs[p.id];
    const div=document.createElement('div');div.className='glass prog';
    const done=pr?pr.doneDays.length:0;
    let act='';
    if(!pr)act='<button class="btn dark sm" onclick="startProg(\''+p.id+'\')">'+T('progStart')+'</button>';
    else if(done>=7)act='<button class="btn sm ghost" onclick="openSess(\''+p.id+'\',0)">'+T('progDone')+'</button>';
    else act='<button class="btn dark sm" onclick="openSess(\''+p.id+'\','+done+')">'+T('progGo').replace('{n}',done+1)+'</button>';
    div.innerHTML='<div class="ph"><div class="pi">'+p.ic+'</div>'+
     '<div class="pt"><div class="pn">'+p.n[L==='zh'?0:1]+'</div><div class="pd">'+p.d[L==='zh'?0:1]+'</div></div></div>'+
     '<div class="pbar"><i style="width:'+(done/7*100)+'%"></i></div>'+
     '<div class="pbar-lbl">'+done+' / 7</div>'+
     '<div style="margin-top:12px">'+act+'</div>';
    el.appendChild(div);
  });
}
function startProg(id){
  if(!isUnlocked()&&activeProgCount()>=1){openPay();return}
  state.progs[id]={start:Date.now(),doneDays:[]};save();renderProgs();
  openSess(id,0);
}
function openSess(id,d){
  const p=PROGS.find(x=>x.id===id),sess=p.days[d];
  const pr=state.progs[id];
  const isDone=pr&&pr.doneDays.indexOf(d)>=0;
  const m=document.createElement('div');m.className='mask on';
  m.innerHTML='<div class="glass sheet">'+
   '<div class="sess" style="background:rgba(255,255,255,.04)">'+
   '<span class="daychip">'+T('progDay').replace('{n}',d+1)+'</span>'+
   '<div style="font-size:17px;font-weight:700;color:var(--gold);margin-top:10px">'+sess.t[L==='zh'?0:1]+'</div>'+
   '<div class="body">'+esc(sess.b[L==='zh'?0:1])+'</div></div>'+
   '<button class="playbtn" style="margin-top:14px;width:100%;justify-content:center" onclick="if(speaking)stopSpeak();else speak(this.closest(\'.sheet\').querySelector(\'.body\').textContent)">'+T('play')+'</button>'+
   (isDone?'':'<button class="btn" style="margin-top:10px" onclick="finishSess(\''+id+'\','+d+',this)">'+T('progMark')+'</button>')+
   '<button class="btn ghost" style="margin-top:8px" onclick="this.closest(\'.mask\').remove()">'+T('close')+'</button></div>';
  document.body.appendChild(m);
  speak(sess.b[L==='zh'?0:1]);
}
function finishSess(id,d,btn){
  const pr=state.progs[id];
  if(pr.doneDays.indexOf(d)<0)pr.doneDays.push(d);
  save();btn.closest('.mask').remove();renderProgs();
  if(pr.doneDays.length>=7){toast(T('progAll'));confettiGo()}
  else toast(tq(14));
}

/* ================= 彩带 ================= */
const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
function confettiGo(){
  cv.width=innerWidth;cv.height=innerHeight;
  const parts=Array.from({length:90},()=>({
    x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.45,
    vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,
    s:Math.random()*6+3,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,
    c:['#ffd97a','#ff9ad5','#9d7bff','#fff'][Math.random()*4|0]}));
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);t++;
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(t<120)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function shareCard(){
  const w=state.wishes.find(x=>!x.done);
  if(!w){toast(tq(7));goTab(document.querySelector('[data-pg=pg-pool]'));return}
  const c=document.createElement('canvas');c.width=750;c.height=1000;
  const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,1000);
  bg.addColorStop(0,'#2b1b5e');bg.addColorStop(.6,'#150b36');bg.addColorStop(1,'#070313');
  g.fillStyle=bg;g.fillRect(0,0,750,1000);
  for(let i=0;i<120;i++){g.globalAlpha=Math.random()*.8+.1;g.fillStyle='#fff';
    g.beginPath();g.arc(Math.random()*750,Math.random()*600,Math.random()*1.8+.5,0,7);g.fill()}
  g.globalAlpha=1;g.textAlign='center';
  g.fillStyle='#ffd97a';g.font='700 46px sans-serif';g.fillText(T('shareTitle'),375,150);
  g.fillStyle='#a99cc9';g.font='22px sans-serif';
  g.fillText(catOf(w.cat).ic+' '+catOf(w.cat).n[L==='zh'?0:1]+' · '+fmt(w.ts),375,205);
  const words=w.text.split('');let line='';const lines=[];
  words.forEach(ch=>{if(g.measureText(line+ch).width>560){lines.push(line);line=ch}else line+=ch});
  lines.push(line);
  g.fillStyle='#f2ecff';g.font='34px sans-serif';
  lines.slice(0,6).forEach((l,i)=>g.fillText(l,375,380+i*56));
  g.fillStyle='#ffd97a';g.font='26px sans-serif';
  g.fillText(T('firstDay')+Math.max(1,Math.ceil((Date.now()-w.ts)/DAY))+T('manifesting'),375,380+Math.min(lines.length,6)*56+40);
  g.fillStyle='#6e5f96';g.font='18px sans-serif';g.fillText(T('shareFoot'),375,1005);
  const qr=new Image();
  qr.onload=()=>{
    g.drawImage(qr,305,800,140,140);
    g.fillStyle='#ffd97a';g.font='700 22px sans-serif';g.fillText(T('scanTip'),375,975);
    openShare(c.toDataURL('image/png'));
  };
  qr.onerror=()=>openShare(c.toDataURL('image/png'));
  qr.src=QR_DATA;
}
let lastCardUrl='';
function openShare(dataUrl){
  lastCardUrl=dataUrl;
  const m=document.createElement('div');m.className='mask on';
  m.innerHTML='<div class="glass sheet" style="border-radius:22px;max-width:360px;padding:14px;text-align:center">'+
   '<img src="'+dataUrl+'" style="width:100%;border-radius:14px;display:block" alt="share card">'+

   '<div style="display:flex;gap:8px;margin-top:10px">'+
    '<button class="btn" style="flex:1;margin-top:0" onclick="doShare()">'+T('shareSend')+'</button>'+

   '<button class="btn ghost" onclick="this.closest(\'.mask\').remove()">'+T('close')+'</button></div>';
  document.body.appendChild(m);
}
async function doShare(){
  const inWx=/MicroMessenger/i.test(navigator.userAgent);
  if(inWx){toast('微信里请长按上方卡片保存到相册 · 或点「复制链接」发给朋友');return}
  try{
    const blob=await (await fetch(lastCardUrl)).blob();
    const file=new File([blob],'wishing-pool.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:T('shareTitle'),text:T('shareFoot')+' → https://wishpool.xin'});
      return;
    }
  }catch(e){/* 用户取消或文件分享不支持，走下面 */}
  if(navigator.share){
    try{await navigator.share({title:T('shareTitle'),text:T('shareFoot'),url:'https://wishpool.xin'})}catch(e){}
  }else{doCopy()}
}
function doCopy(){
  const done=()=>toast(T('copied'));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText('https://wishpool.xin').then(done,()=>fallbackCopy(done));
  }else fallbackCopy(done);
}
function fallbackCopy(done){
  const ta=document.createElement('textarea');ta.value='https://wishpool.xin';
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){}
  ta.remove();

/* ================= 订阅墙 ================= */
const PAY_LINKS=[
 'https://mbd.pub/o/bread/YZaWmJpsbQ==',
 'https://mbd.pub/o/bread/mbd-YZaWmJptZg==',
 'https://mbd.pub/o/bread/YZaWmJptaA=='
];
const REDEEM_HASH={
 week:'a2058ba731b41ac6fb43d1b1f91d5fc9c953f90a471a71641a81dcd65af15e43',
 year:'32595177b8426f6e67560bf41248f84f3e8ec6e1ddab23b000b9319b1e47c688',
 life:'736c9abed62e899365ee8cb14cc50860129c6028e0c3e3c6c35af5be552541eb'
};
const PLAN_KEYS=['week','year','life'];
function isUnlocked(){return state.unlocked||(state.sub&&Date.now()<state.sub.exp)}
async function sha256hex(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function redeem(){
  const inp=document.getElementById('redeemInput');
  if(!inp) return;
  const code=inp.value.trim().toUpperCase();
  if(!code){toast(tq(24));return}
  const h=await sha256hex(code);
  const key=PLAN_KEYS[planIdx];
  if(h===REDEEM_HASH[key]){
    const now=Date.now();
    state.sub={plan:key,exp:key==='life'?Infinity:now+(key==='week'?7:365)*DAY};
    save();closePay();toast(tq(4));
  }else{
    // 也许是其他档位的码：全部比对，匹配哪个开哪个
    let hit=null;
    for(let i=0;i<PLAN_KEYS.length;i++){
      if(h===REDEEM_HASH[PLAN_KEYS[i]]){hit=i;break}
    }
    if(hit!==null){
      const k2=PLAN_KEYS[hit];
      const now=Date.now();
      if(k2==='life'){state.unlocked=true}
      else{state.sub={plan:k2,exp:now+(k2==='week'?7:365)*DAY}}
      save();closePay();toast(tq(4));
    }else{toast(tq(25))}
  }
}
function goBuy(){window.open(PAY_LINKS[planIdx],'_blank')}
let planIdx=1;
function openPay(){renderPay();document.getElementById('payMask').classList.add('on')}
function closePay(){document.getElementById('payMask').classList.remove('on')}
function renderPay(){
  document.getElementById('paySheet').innerHTML=
   '<div class="pay-head"><div class="crown">👑</div><h3>'+T('payTitle')+'</h3><p>'+T('payDesc')+'</p></div>'+
   '<div class="plans">'+T('plans').map((p,i)=>'<div class="plan '+(i===planIdx?'on':'')+'" onclick="pickPlan('+i+')">'+(i===1?'<span class="save">'+T('saveTag')+'</span>':'')+'<div class="pp">'+p[0]+'</div><div class="pd">'+p[1]+'</div></div>').join('')+'</div>'+
   '<button class="btn" onclick="goBuy()">'+T('buyNow')+'</button>'+
   '<div style="display:flex;gap:8px;margin-top:10px;align-items:stretch">'+
    '<input id="redeemInput" placeholder="'+T('redeemPh')+'" style="flex:1;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:13px"/>'+
    '<button class="btn ghost" style="margin-top:0;padding:10px 18px" onclick="redeem()">'+T('redeemBtn')+'</button></div>'+
   '<div class="pay-note">'+T('payNote')+'</div>'+
   '<button class="btn ghost" onclick="closePay()">'+T('later')+'</button>';
}
function pickPlan(i){planIdx=i;document.querySelectorAll('#paySheet .plan').forEach((p,j)=>p.classList.toggle('on',j===i))}

/* ================= 页签 ================= */
function goTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===el));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===el.dataset.pg));

function renderAll(){
  document.getElementById('nAll').textContent=state.wishes.length;
  document.getElementById('nDone').textContent=state.wishes.filter(w=>w.done).length;
  document.getElementById('nWait').textContent=state.wishes.filter(w=>!w.done).length;

}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);
}
/* 首访语言 */
if(!state.langSet){
  const nav=(navigator.language||'').toLowerCase();
  L=nav.indexOf('zh')===0?'zh':'en';
  state.langSet=true;save();
}
/* 今日时刻新鲜度标记 */
if(state.lastDaily===todayKey()){
  document.getElementById('freshChip').textContent=T('fresh');
  document.getElementById('freshChip').style.display='inline-block';
}
applyLang();renderAll();ensureAffs();renderAffs();calcStreak();renderJournal();

/* ================= 数据备份 ================= */
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='wishpool-backup-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast(tq(21));
  }catch(e){toast('⚠️ Export error')}
}
function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||typeof d!=='object'||!Array.isArray(d.wishes))throw 0;
        state=Object.assign(
          {wishes:[],journal:{},profile:null,unlocked:false,sub:null,genCount:0,lang:L,
           affs:{date:'',list:[]},customAffs:[],progs:{},settings:{remOn:false,remTime:'21:00',lastRem:''},lastDaily:'',affsRefreshed:''},
          d);
        state.langSet=true;
        L=state.lang==='en'?'en':'zh';
        save();applyLang();renderAll();ensureAffs();renderAffs();calcStreak();renderJournal();
        document.getElementById('remTime').value=state.settings.remTime||'21:00';
        syncRem();
        toast(tq(22));
      }catch(e){toast(tq(23))}
    };
    r.readAsText(f);
  };
  inp.click();
}
