*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{

.tc-main{min-width:0;flex:1}

/* ============ 工具面板 ============ */
.tpanel{

/* ============ 按钮 / 输入控件 ============ */
.btn{

input[type=file]{font-size:13px;max-width:100%;color:var(--muted)}

}
input[type=file]::file-selector-button:hover{filter:brightness(1.09)}
input[type=number],input[type=text],input[type=date],input[type=datetime-local],input[type=password],select{
  min-height:38px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;
  background:var(--card);color:var(--text);font-variant-numeric:tabular-nums;transition:.18s;

input[type=number]:hover,input[type=text]:hover,input[type=date]:hover,select:hover{border-color:var(--border-strong)}
input[type=range]{vertical-align:middle;accent-color:var(--primary)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:15px;height:15px;cursor:pointer}
textarea{

}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
select{cursor:pointer}
input[type=color]{
  width:48px;height:38px;padding:3px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);cursor:pointer;appearance:none;-webkit-appearance:none;transition:.18s;

input[type=color]:hover{border-color:var(--border-strong)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
input[type=color]::-moz-color-swatch{border:none;border-radius:7px}

/* ============ 结果展示 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:13px 8px;text-align:center;transition:.18s}

.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sw{

function icoSvg(tid){
  var body=ICON[TICON[tid]]||ICON.dot;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+body+'</svg>';
}
(function(){
  PANELS.forEach(function(h){$("panels").insertAdjacentHTML("beforeend",h);});
  /* 给每个工具面板统一加上「图标 + 标题」页头 */
  document.querySelectorAll(".tpanel").forEach(function(p){
    var id=p.id.replace(/^t-/,""),t=null,i;
    for(i=0;i<TOOLS.length;i++){if(TOOLS[i].id===id){t=TOOLS[i];break;}}
    if(!t||p.querySelector(".p-head"))return;
    var h2=p.querySelector("h2"),d=p.querySelector(".desc"),back=p.querySelector(".back");
    if(!h2||!back)return;
    var wrap=document.createElement("div");wrap.className="p-head";
    var ic=document.createElement("div");ic.className="tc-ico c-"+t.cat;ic.innerHTML=icoSvg(id);
    var box=document.createElement("div");box.className="p-title";
    box.appendChild(h2);if(d)box.appendChild(d);
    wrap.appendChild(ic);wrap.appendChild(box);
    back.insertAdjacentElement("afterend",wrap);
  });
  INITS.forEach(function(f){try{f()}catch(e){console.error(e)}});
  var catalog=$("catalog"),html="",n=0;
  CATS.forEach(function(c){
    var list=TOOLS.filter(function(t){return t.cat===c[0]});
    if(!list.length)return;
    html+='<div class="cat-block"><div class="cat-title"><span class="dot dot-'+c[0]+'"></span>'+c[1]+'<small>'+list.length+' 个</small></div><div class="grid">';
    list.forEach(function(t){
      html+='<div class="tool-card" tabindex="0" style="--i:'+(n++)+'" data-id="'+t.id+'" data-name="'+(t.name+" "+t.desc)+'">'
           +'<div class="tc-ico c-'+t.cat+'">'+icoSvg(t.id)+'</div><div class="tc-main"><b>'+t.name+'</b><span>'+t.desc+'</span></div></div>';
    });
    html+='</div></div>';
  });
  catalog.innerHTML=html;
  catalog.addEventListener("click",function(e){
    var card=e.target.closest(".tool-card");if(card)openTool(card.getAttribute("data-id"));
  });
  catalog.addEventListener("keydown",function(e){
    if(e.key!=="Enter"&&e.key!==" ")return;
    var card=e.target.closest(".tool-card");
    if(card){e.preventDefault();openTool(card.getAttribute("data-id"));}
  });
  $("search").addEventListener("input",function(e){
    var q=e.target.value.trim().toLowerCase(),shown=0;
    document.querySelectorAll("#catalog .tool-card").forEach(function(c){
      var hit=!q||c.getAttribute("data-name").toLowerCase().indexOf(q)>=0;
      c.classList.toggle("hidden",!hit);if(hit)shown++;
    });
    document.querySelectorAll("#catalog .cat-block").forEach(function(b){
      var any=b.querySelector(".tool-card:not(.hidden)");
      b.style.display=any?"":"none";
    });
    $("noRes").style.display=(q&&!shown)?"block":"none";
  });
  if(window.SEO){
    TOOLS.forEach(function(t){
      var d=SEO[t.id],p=document.getElementById("t-"+t.id);
      if(!d||!p||p.querySelector(".about-box"))return;
      var h='<div class="about-box"><h3>关于 '+t.name+'</h3><p>'+d.intro+'</p><h3>常见问题</h3>';
      d.faqs.forEach(function(f){h+='<div class="faq"><b>'+f[0]+'</b><p>'+f[1]+'</p></div>';});
      if(d.related.length){
        h+='<h3>相关工具</h3><div class="rel">';
        d.related.forEach(function(rid){
          var rt=null;for(var i=0;i<TOOLS.length;i++){if(TOOLS[i].id===rid){rt=TOOLS[i];break;}}
          if(rt)h+='<a href="/tool/'+rid+'/">'+rt.name+'</a>';
        });
        h+='</div>';
      }
      h+='</div>';
      p.insertAdjacentHTML("beforeend",h);
    });
  }
  window.addEventListener("popstate",function(){ if(!routeFromPath())goHome(false); });
  routeFromPath();
})();
</script>
<script>
/* ===== 文件选择器美化（原生控件换成中文胶囊按钮） ===== */
document.querySelectorAll('input[type=file]').forEach(function(inp){
  if(inp.dataset.fp)return;inp.dataset.fp="1";
  var wrap=document.createElement("div");wrap.className="fp";
  var lab=document.createElement("span");lab.className="fp-btn";lab.textContent="选择文件";
  var nm=document.createElement("span");nm.className="fp-name";nm.textContent="未选择文件";
  inp.style.display="none";
  inp.parentNode.insertBefore(wrap,inp);
  wrap.appendChild(lab);wrap.appendChild(nm);wrap.appendChild(inp);
  lab.addEventListener("click",function(){inp.click();});
  inp.addEventListener("change",function(){
    var n=inp.files?inp.files.length:0;
    if(!n){nm.textContent="未选择文件";nm.classList.remove("has");return;}
    nm.textContent=n>1?(n+" 个文件 · "+inp.files[0].name):inp.files[0].name;
    nm.classList.add("has");
  });
});
/* ===== 快捷键：/ 聚焦搜索，Esc 清空 ===== */
document.addEventListener("keydown",function(e){
  var tag=(document.activeElement||{}).tagName||"";
  if(e.key==="/"&&tag!=="INPUT"&&tag!=="TEXTAREA"&&tag!=="SELECT"){
    e.preventDefault();$("search").focus();
  }else if(e.key==="Escape"&&document.activeElement===$("search")){
    $("search").value="";$("search").dispatchEvent(new Event("input"));$("search").blur();
  }
});
</script>
